name: Update Billboard chart data

on:
  schedule:
    # Billboard usually publishes Tuesday mornings, occasionally slipping to
    # Wednesday (e.g. after a Monday holiday). These times are UTC and
    # correspond to roughly 6am/8am/10am US Eastern during EDT (UTC-4) --
    # shift by an hour each way around the March/November DST changeovers if
    # you want to hold the same local time year-round; GitHub Actions cron
    # has no timezone support, so the schedule itself doesn't auto-adjust.
    # Minutes are deliberately NOT :00 -- GitHub's own docs warn that
    # schedules right on the hour are the most likely to be delayed or
    # dropped during high platform load, since that's when everyone else's
    # :00 schedules fire too.
    # Each run only actually does work for charts that aren't caught up yet
    # -- see next_chart_date_target() in run_pipeline.py -- so there's no
    # need to track "already checked" separately; a chart that already has
    # this week's data just makes zero HTTP requests on the later runs.
    - cron: "13 10 * * 2"   # Tue ~6am ET
    - cron: "13 12 * * 2"   # Tue ~8am ET
    - cron: "13 14 * * 2"   # Tue ~10am ET
    - cron: "13 10 * * 3"   # Wed ~6am ET (only matters if Tuesday's checks came up empty)
    - cron: "13 12 * * 3"   # Wed ~8am ET
    - cron: "13 14 * * 3"   # Wed ~10am ET
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write  # needed to commit the refreshed data/ files back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline for all charts
        run: python run_pipeline.py

      # if: always() is deliberate: run_pipeline.py isolates failures
      # per-chart already, but the whole script still exits non-zero if any
      # chart failed. Without always(), a single failing chart would
      # discard the successfully updated data for every OTHER chart too,
      # since this step would just be skipped after a failed prior step.
      - name: Commit and push updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Automated chart data update ($(date -u +'%Y-%m-%d'))"
          git push